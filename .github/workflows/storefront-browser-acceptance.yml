name: Storefront browser acceptance
on:
  push:
    branches: [feature/intelligent-shopping-conversion]
    paths:
      - 'app/**'
      - 'src/**'
      - 'tests/storefront-browser-acceptance.cjs'
      - '.github/workflows/storefront-browser-acceptance.yml'
      - 'package*.json'
      - 'next.config.ts'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_SUPABASE_URL: ''
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ''
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ''
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install locked application dependencies
        run: npm ci
      - name: Build isolated application
        run: npm run build
      - name: Install browser test runner
        run: |
          npm install --no-save --package-lock=false playwright@1.51.1
          npx playwright install --with-deps chromium
      - name: Start local storefront and execute acceptance
        run: |
          set -euo pipefail
          npm start -- --hostname 127.0.0.1 > /tmp/storefront.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for i in {1..60}; do
            if curl --fail --silent http://127.0.0.1:3000/api/health >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:3000/api/health
          node tests/storefront-browser-acceptance.cjs
