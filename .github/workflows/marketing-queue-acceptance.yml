name: Marketing queue acceptance
on:
  push:
    branches: [feature/intelligent-shopping-conversion]
    paths:
      - 'docs/commerce/sql/marketing_execution_queue.sql'
      - 'tests/marketing-queue-*.sql'
      - 'tests/marketing-queue-*.sh'
      - '.github/workflows/marketing-queue-acceptance.yml'
  pull_request:
    paths:
      - 'docs/commerce/sql/marketing_execution_queue.sql'
      - 'tests/marketing-queue-*.sql'
      - 'tests/marketing-queue-*.sh'
      - '.github/workflows/marketing-queue-acceptance.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: dealwovo_queue_test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U postgres -d dealwovo_queue_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Run database assertions inside disposable service
        env:
          DB_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          for file in tests/marketing-queue-fixture.sql docs/commerce/sql/marketing_execution_queue.sql tests/marketing-queue-acceptance.sql; do
            docker exec -i "$DB_CONTAINER" psql -X -v ON_ERROR_STOP=1 -U postgres -d dealwovo_queue_test < "$file"
          done

      - name: Verify independent concurrent claims
        env:
          DB_CONTAINER: ${{ job.services.postgres.id }}
        run: bash tests/marketing-queue-concurrency.sh
