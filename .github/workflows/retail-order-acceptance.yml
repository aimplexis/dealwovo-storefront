name: Retail order transaction acceptance
on:
  push:
    branches: [feature/intelligent-shopping-conversion]
    paths:
      - 'docs/commerce/sql/retail_*.sql'
      - 'tests/retail-order-*.sql'
      - 'tests/supplier-observation-fixture.sql'
      - '.github/workflows/retail-order-acceptance.yml'
  pull_request:
    paths:
      - 'docs/commerce/sql/retail_*.sql'
      - 'tests/retail-order-*.sql'
      - 'tests/supplier-observation-fixture.sql'
      - '.github/workflows/retail-order-acceptance.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: dealwovo_order_test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U postgres -d dealwovo_order_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Run database assertions inside disposable service
        env:
          DB_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          for file in tests/supplier-observation-fixture.sql docs/commerce/sql/retail_supplier_intake.sql docs/commerce/sql/retail_supplier_products.sql docs/commerce/sql/retail_order_ledger.sql tests/retail-order-acceptance.sql; do
            docker exec -i "$DB_CONTAINER" psql -X -v ON_ERROR_STOP=1 -U postgres -d dealwovo_order_test < "$file"
          done

      - name: Verify simultaneous order transitions
        env:
          DB_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          db() { docker exec -i "$DB_CONTAINER" psql -X -v ON_ERROR_STOP=1 -U postgres -d dealwovo_order_test "$@"; }
          db <<'SQL'
          select set_config('request.jwt.claim.sub','00000000-0000-4000-8000-000000000001',false);
          insert into public.retail_suppliers(id,legal_name,kind,website,country,contact_email,method,categories)
          values ('00000000-0000-4000-8000-000000000010','Concurrency Fixture','wholesaler','https://example.com','US','test@example.com','csv','Home');
          insert into public.retail_supplier_products(id,supplier_id,sku,title,category_hint,wholesale_cents,retail_cents,shipping_cents,reported_quantity,source_reference,observed_at)
          values ('00000000-0000-4000-8000-000000000011','00000000-0000-4000-8000-000000000010','FIX-1','Fixture product','Home',1000,2500,300,10,'fixture evidence',now()-interval '2 hours');
          insert into public.retail_orders(id,product_id,quantity,total_cents,created_at,updated_at)
          values ('00000000-0000-4000-8000-000000000021','00000000-0000-4000-8000-000000000011',1,2500,now()-interval '1 hour',now()-interval '1 hour');
          SQL
          db -c "begin; select public.record_retail_order_event('00000000-0000-4000-8000-000000000021',0,'payment_verified','payment-one',now()-interval '1 minute',2500,'USD'); select pg_sleep(4); commit;" > /tmp/order-first.log 2>&1 &
          first=$!
          # Wait until the first session is holding the row lock.
          ready=0
          for i in $(seq 1 30); do
            if [ "$(db -Atc "select count(*) from pg_stat_activity where wait_event='PgSleep' and query like '%payment-one%'")" = 1 ]; then ready=1; break; fi
            sleep 0.1
          done
          test "$ready" = 1
          if db -c "select public.record_retail_order_event('00000000-0000-4000-8000-000000000021',0,'payment_verified','payment-two',now(),2500,'USD');" > /tmp/order-second.log 2>&1; then
            echo "Unexpected concurrent success"; exit 1
          fi
          wait "$first"
          grep -F 'Invalid or stale order event' /tmp/order-second.log
          test "$(db -Atc "select count(*) from public.retail_orders where state='paid' and version=1 and payment_ref='payment-one'")" = 1
          test "$(db -Atc "select count(*) from public.retail_order_events")" = 1
          echo "PASS independent-session order concurrency"
