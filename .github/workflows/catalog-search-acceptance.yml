name: Catalog search acceptance
on:
  push:
    branches: [feature/intelligent-shopping-conversion]
    paths:
      - 'docs/commerce/public-catalog-search.sql'
      - 'tests/catalog-search-*.sql'
      - '.github/workflows/catalog-search-acceptance.yml'
  pull_request:
    paths:
      - 'docs/commerce/public-catalog-search.sql'
      - 'tests/catalog-search-*.sql'
      - '.github/workflows/catalog-search-acceptance.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: dealwovo_catalog_test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U postgres -d dealwovo_catalog_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Run database assertions inside disposable service
        env:
          DB_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          for file in tests/catalog-search-fixture.sql docs/commerce/public-catalog-search.sql tests/catalog-search-acceptance.sql; do
            docker exec -i "$DB_CONTAINER" psql -X -v ON_ERROR_STOP=1 -U postgres -d dealwovo_catalog_test < "$file"
          done

